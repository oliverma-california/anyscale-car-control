<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anyscale Car Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,100;100,300;100,500&family=Inter:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #002966;
    --blue: #0066FF;
    --blue-light: #619AF1;
    --tile-off: #D9D9D9;
    --chip: #EDE7E3;
    --text: #000;
    --text-muted: #3f3d3d;
    --white: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* Clip to the screen so the scaled canvas can never widen the page (phones would zoom out) */
  html { overflow: hidden; }
  body { position: fixed; inset: 0; }
  body {
    background: var(--bg);
    overflow: hidden;
    display: grid;
    place-items: center;
    font-family: 'Archivo', system-ui, sans-serif;
    font-variation-settings: "wdth" 100;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 1.5px solid var(--blue-light); outline-offset: 1px; }

  /* The design is a 450×286 canvas; it is scaled to fit the window. */
  /* Sized with CSS zoom (not a scale transform) so Safari draws faded/filtered layers sharp */
  .stage { width: 450px; height: 286px; position: relative; flex: none; transform-origin: center; }
  .stage.m { width: 260px; height: 440px; }
  .abs { position: absolute; }
  .img { display: block; width: 100%; height: 100%; }
  .t9 { font-size: 9px; line-height: normal; }
  .medium { font-weight: 500; }
  .light { font-weight: 300; }
  .thin { font-weight: 100; }

  /* Hex background */
  .hex { left: 111.6px; top: 44.74px; width: 297.43px; height: 264.26px; pointer-events: none; transition: opacity .4s, filter .4s; }
  .stage.off .hex { opacity: .25; filter: grayscale(.6); }
  .stage.live .hex { animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { filter: brightness(1.18) drop-shadow(0 0 6px rgba(0,102,255,.5)); } }

  /* Header */
  .header { left: 10px; top: 10px; width: 430px; height: 37px; background: var(--white); border-radius: 8px; }
  .logo-left { left: 20px; top: 20px; width: 17px; height: 17px; overflow: hidden; }
  .logo-left img { position: absolute; left: -15.38%; top: -15.38%; width: 130.77%; height: 130.77%; max-width: none; }
  .logo-x { left: 42px; top: 21px; font: italic 700 12px/normal 'Inter', sans-serif; color: #000; white-space: nowrap; }
  .logo-any { left: 54px; top: 20px; width: 72px; height: 17px; object-fit: cover; }
  /* Stop button: red stop square while driving; blue play triangle to resume once stopped */
  .stop { left: 409px; top: 18px; width: 21px; height: 21px; border-radius: 50%; background: #e5484d; transition: background .2s, transform .15s; }
  .stop:hover { transform: scale(1.08); }
  .stop:active { transform: scale(.95); }
  .stop svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stop .resume, .stop[aria-pressed="true"] .halt { display: none; }
  .stop[aria-pressed="true"] { background: var(--blue); }
  .stop[aria-pressed="true"] .resume { display: block; }
  .stage.stopped .hex { animation: none; }

  /* Tiles */
  .tile { width: 66px; height: 62px; text-align: left; transition: transform .15s; }
  .tile:hover:not(:disabled) { transform: translateY(-1px); }
  .tile:active:not(:disabled) { transform: scale(.97); }
  .tile:disabled { cursor: not-allowed; }
  .tile .bg { position: absolute; inset: 0; }
  .tile .bg img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .2s; }
  .tile .bg .on { opacity: 0; }
  .tile[aria-pressed="true"] .bg .on, .stage.live .tile .bg .on { opacity: 1; }
  .stage.live .tile .label { color: var(--text); }
  .tile .dot { left: 7px; top: 7px; width: 21px; height: 21px; }
  .tile .dot img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .2s; }
  .tile .dot .on { opacity: 0; }
  .tile[aria-pressed="true"] .dot .on, .stage.live .tile .dot .on { opacity: 1; }
  .tile .ico { object-fit: cover; pointer-events: none; }
  .tile .label { left: 7px; width: 56px; color: var(--text-muted); transition: color .2s; }
  .tile[aria-pressed="true"] .label { color: var(--text); }
  .tile .state { right: 6px; bottom: 5px; font-size: 6px; font-weight: 300; color: var(--text-muted); opacity: 0; transition: opacity .2s; }
  .tile .state:not(:empty) { opacity: 1; }
  .tile.busy .dot .on { animation: blink .6s ease-in-out infinite; opacity: 1; }
  @keyframes blink { 50% { opacity: .3; } }

  /* Model selection */
  .panel { left: 296px; top: 66px; width: 132px; height: 124px; }
  .panel > .bg { position: absolute; inset: 0; }
  .panel .title { left: 10px; top: 10px; width: 75px; height: 13px; color: var(--text); }
  .help { left: 110px; top: 7px; width: 15px; height: 15px; border-radius: 50%; }
  .help span { position: absolute; left: 5px; top: 3px; color: #fff; font-size: 9px; font-weight: 500; line-height: normal; }
  .help:hover img { filter: brightness(.92); }
  .tip { left: 292px; top: 96px; width: 140px; padding: 6px 8px; background: #fff; border-radius: 6px; font-size: 7px; line-height: 1.35; color: var(--text-muted);
         box-shadow: 0 4px 12px rgba(0,0,0,.25); opacity: 0; transform: translateY(-3px); pointer-events: none; transition: opacity .15s, transform .15s; z-index: 5; }
  .tip.show { opacity: 1; transform: none; }
  .divider { left: 0; top: 28.5px; width: 132px; height: 1px; }
  .sel { left: 7px; width: 118px; height: 27px; transition: top .22s cubic-bezier(.3,.7,.3,1); }
  .opt { left: 7px; width: 118px; height: 27px; text-align: left; border-radius: 8px; }
  .opt:hover:not(:disabled):not([aria-checked="true"]) { background: rgba(237,231,227,.45); }
  .opt .dot { left: 3px; top: 3px; width: 21px; height: 21px; }
  .opt .lbl { left: 34px; top: 6px; width: 80px; color: var(--text); }
  .opt .ico { left: 8px; top: 8px; width: 11px; height: 11px; object-fit: cover; }
  .opt .ico.line { left: 7.66px; top: 7.63px; width: 11.67px; height: 10.74px; }
  .opt .ico.flip { transform: scaleX(-1); }

  /* Max speed */
  .speed { left: 338px; top: 203px; width: 90px; height: 23px; }
  .speed .white { position: absolute; inset: 0; background: #fff; border-radius: 8px; }
  .speed .chip { left: 59.29px; top: 0; width: 30.706px; height: 23px; background: var(--chip); border-radius: 8px; text-align: left; }
  .speed .chip:hover { filter: brightness(.97); }
  .speed .chip:focus-within { box-shadow: inset 0 0 0 1px var(--blue-light); }
  .speed.invalid .chip { box-shadow: inset 0 0 0 1px #e5484d; }
  .speed .lbl { left: 8px; top: 7px; width: 48.706px; color: #000; }
  .speed .val { left: 0; top: 0; width: 17px; height: 23px; padding: 0 0 0 5.71px; border: 0; background: transparent; border-radius: 8px 0 0 8px;
                font-family: 'Archivo', sans-serif; font-variation-settings: "wdth" 100; color: #000; outline: none; cursor: text; }
  .speed .val:disabled { cursor: not-allowed; }
  .speed .arrow-btn { left: 15px; top: 0; width: 15.7px; height: 23px; border-radius: 0 8px 8px 0; }
  .speed .arrow { left: 1px; top: 5px; width: 13px; height: 13px; transition: transform .2s; pointer-events: none; }
  .speed.open .arrow { transform: rotate(180deg); }
  .menu { right: 0; bottom: 26px; width: 30.706px; background: #fff; border-radius: 8px; padding: 3px; overflow: hidden; box-shadow: 0 4px 14px rgba(0,0,0,.3);
          opacity: 0; transform: translateY(4px); pointer-events: none; transition: opacity .15s, transform .15s; z-index: 5; }
  .speed.open .menu { opacity: 1; transform: none; pointer-events: auto; }
  .menu button { display: block; width: 100%; padding: 2px 0; font-size: 9px; font-weight: 100; text-align: center; border-radius: 5px; }
  .menu button:focus-visible { outline-offset: -1px; }
  .menu button:hover, .menu button.cur { background: var(--chip); }
  .menu button.cur { font-weight: 300; }

  /* Car IP */
  .ip { left: 22px; top: 220px; width: 132px; height: 23px; }
  .ip .white { position: absolute; inset: 0; background: #fff; border-radius: 8px; }
  .ip .field { left: 86.96px; top: 0; width: 45.035px; height: 23px; background: var(--chip); border-radius: 8px; transition: left .22s, width .22s, box-shadow .2s; }
  .ip.editing .field, .ip.filled .field { left: 26px; width: 106px; }
  .ip input { position: absolute; inset: 0; width: 100%; border: 0; background: transparent; border-radius: 8px; padding: 0 7px; font: 300 9px/23px 'Archivo', sans-serif; color: #000; outline: none; }
  .ip input::placeholder { color: transparent; }
  .ip.editing input::placeholder { color: #a9a29d; }
  .ip.invalid .field { box-shadow: inset 0 0 0 1px #e5484d; }
  .ip .lbl { left: 29px; top: 7px; width: 77px; height: 10px; color: #000; letter-spacing: -0.25px; white-space: nowrap; pointer-events: none; transition: opacity .15s; }
  .ip.editing .lbl, .ip.filled .lbl { opacity: 0; }
  .ip .dot { left: 2px; top: 1px; width: 21px; height: 21px; }
  .ip .globe { left: 5px; top: 4px; width: 15px; height: 15px; }

  /* Volume */
  .vol-btn { left: 10px; top: 255px; width: 21px; height: 21px; border-radius: 50%; }
  .vol-btn .icon { position: absolute; left: 3px; top: 3px; width: 15.001px; height: 15.001px; transition: opacity .2s; }
  .vol-btn .mute { position: absolute; left: 4px; top: 10px; width: 13px; height: 1.2px; background: #fff; transform: rotate(-45deg); opacity: 0; transition: opacity .2s; }
  .vol-btn.muted .mute { opacity: 1; }
  .vol-btn.muted .icon { opacity: .7; }
  .slider { left: 38px; top: 258px; width: 100px; height: 13px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .slider.drag { cursor: grabbing; }
  .slider img { -webkit-user-drag: none; user-select: none; pointer-events: none; }
  /* Taller invisible hit area so the thin slider is easy to grab */
  .slider::before { content: ""; position: absolute; left: -4px; right: -4px; top: -6px; bottom: -6px; }
  .slider .track { position: absolute; inset: 0; }
  .slider .fill { position: absolute; top: 2px; height: 9px; right: 2px; }
  .slider .fill img { width: 100%; height: 100%; display: block; }
  .slider .knob { position: absolute; top: 0; width: 13px; height: 13px; transition: transform .1s; }
  .slider:hover .knob, .slider.drag .knob { transform: scale(1.12); }
  .slider .readout { position: absolute; left: 50%; top: -12px; transform: translateX(-50%); font-size: 7px; color: #fff; opacity: 0; transition: opacity .15s; white-space: nowrap; pointer-events: none; }
  .slider.drag .readout, .slider:focus-visible .readout { opacity: .9; }

  /* Level 1: login card. Only this shows until the car is connected */
  .login-card { left: 115px; top: 72px; width: 220px; height: 142px; background: #fff; border-radius: 10px;
                box-shadow: 0 8px 24px rgba(0, 10, 40, .45); transition: opacity .35s, transform .35s, visibility 0s; }
  .stage:not(.login) .login-card { opacity: 0; visibility: hidden; transform: scale(.96); pointer-events: none;
                                   transition: opacity .35s, transform .35s, visibility 0s .35s; }
  .login-card .ico { left: 14px; top: 13px; width: 21px; height: 21px; }
  .login-card .ico .plug { left: 3px; top: 3px; width: 15px; height: 15px; }
  .login-card h1 { left: 42px; top: 13px; margin: 0; font-size: 11px; font-weight: 500; line-height: 21px; color: var(--text); white-space: nowrap; }
  .login-card .sub { left: 14px; top: 42px; width: 192px; margin: 0; font-size: 7.5px; font-weight: 300; line-height: 1.35; color: var(--text-muted); }
  .login-field { left: 14px; top: 66px; width: 192px; height: 23px; background: var(--chip); transition: box-shadow .2s;
                 /* Left corners follow the globe circle (10.5px radius, 1px inset); right corners stay 8px */
                 border-radius: 11.5px 8px 8px 11.5px; }
  .login-field .dot { left: 1px; top: 1px; width: 21px; height: 21px; }
  .login-field .globe { left: 4px; top: 4px; width: 15px; height: 15px; }
  .login-field input { position: absolute; inset: 0; width: 100%; border: 0; background: transparent; border-radius: inherit; padding: 0 8px 0 29px;
                       font: 300 9px/23px 'Archivo', sans-serif; color: #000; outline: none; }
  .login-field input::placeholder { color: #a9a29d; }
  .login-field:focus-within { box-shadow: inset 0 0 0 1px var(--blue-light); }
  .login-field.invalid { box-shadow: inset 0 0 0 1px #e5484d; }
  .login-field.shake { animation: shake .4s; }
  .login-field.busy input { color: var(--text-muted); }
  .login-btn { left: 14px; top: 96px; width: 192px; height: 23px; background: var(--blue); color: #fff; border-radius: 8px;
               font-size: 9px; font-weight: 500; text-align: center; transition: filter .2s, transform .15s; }
  .login-btn:hover:not(:disabled) { filter: brightness(1.1); }
  .login-btn:active:not(:disabled) { transform: scale(.98); }
  .login-btn:disabled { cursor: progress; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .7; } }
  .login-card .err { left: 14px; top: 125px; width: 192px; margin: 0; font-size: 7px; line-height: 1.2; color: #e5484d; }

  /* Level 2: the control panel, revealed once the car is connected */
  .dash { position: absolute; inset: 0; transition: opacity .4s, visibility 0s; }
  .stage.login .dash { opacity: 0; visibility: hidden; transition: opacity .4s, visibility 0s .4s; }
  /* (Each level turns visible at once when revealed and only hides after fading out, so focus can move to it straight away) */

  .tile.unlocked-flash .bg { animation: unlock .6s ease-out; }
  @keyframes unlock { 0% { filter: brightness(1.25); } 100% { filter: none; } }
  .ip.shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-2px); } 40%, 80% { transform: translateX(2px); } }
  .ip.locked .field { background: #f4f1ef; }
  .ip.locked input { color: var(--text-muted); cursor: default; }
  .stage.stopped .stop::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--blue); animation: ping 1.8s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.9); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }

  /* In-page windows */
  .win { position: absolute; display: flex; flex-direction: column; background: #fff; border-radius: 8px; overflow: hidden;
         box-shadow: 0 6px 20px rgba(0, 10, 40, .55), 0 0 0 .5px rgba(255,255,255,.25); animation: win-in .18s ease-out; outline: none; }
  .win:focus-visible { outline: none; }
  .win.closing { animation: win-out .14s ease-in forwards; }
  @keyframes win-in { from { opacity: 0; transform: scale(.94); } }
  @keyframes win-out { to { opacity: 0; transform: scale(.94); } }
  .win:not(.front) { box-shadow: 0 4px 12px rgba(0, 10, 40, .4), 0 0 0 .5px rgba(255,255,255,.15); }
  .win:not(.front) .bar { background: #f3f1ef; }
  .win .bar { flex: none; height: 17px; display: flex; align-items: center; gap: 4px; padding: 0 3px 0 4px; background: #fff;
              cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; border-bottom: .5px solid var(--chip); }
  .win.dragging .bar { cursor: grabbing; }
  .win .wdot { position: relative; flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--blue); }
  .win .wdot img { position: absolute; left: 2px; top: 2px; width: 7px; height: 7px; -webkit-user-drag: none; }
  .win .ttl { flex: 1; font-size: 7.5px; font-weight: 500; color: #000; white-space: nowrap; }
  .win .x { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--chip); position: relative; }
  .win .x::before, .win .x::after { content: ""; position: absolute; left: 3px; top: 5px; width: 5px; height: .9px; background: #3f3d3d; transform: rotate(45deg); }
  .win .x::after { transform: rotate(-45deg); }
  .win .x:hover { background: #e5484d; }
  .win .x:hover::before, .win .x:hover::after { background: #fff; }
  /* Full-screen toggle (camera and LiDAR windows) */
  .win .fs { flex: none; width: 11px; height: 11px; border-radius: 50%; background: var(--chip); position: relative; color: #3f3d3d; }
  .win .fs svg { position: absolute; inset: 2.5px; width: 6px; height: 6px; }
  .win .fs .shrink, .win.full .fs .grow { display: none; }
  .win.full .fs .shrink { display: block; }
  .win .fs:hover { background: var(--blue); color: #fff; }
  .win.full { border-radius: 0; box-shadow: none; }
  .win.full .bar { cursor: default; }
  .win .body { position: relative; flex: 1; min-height: 0; }
  .win canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .win .body.dark { background: #050d1f; }
  .win .hint { position: absolute; right: 4px; bottom: 3px; font-size: 5.5px; color: rgba(255,255,255,.45); pointer-events: none; }

  /* Server window */
  .srv { padding: 6px 7px; display: flex; flex-direction: column; gap: 5px; height: 100%; font-size: 7px; color: #000; }
  .srv .row { display: flex; gap: 4px; align-items: center; }
  .srv input { flex: 1; min-width: 0; height: 15px; border: 0; border-radius: 6px; background: var(--chip); padding: 0 5px;
               font: 300 7px 'Archivo', sans-serif; color: #000; outline: none; }
  .srv input:focus { box-shadow: inset 0 0 0 1px var(--blue-light); }
  .srv input:read-only { color: var(--text-muted); }
  .srv .btn { height: 15px; padding: 0 7px; border-radius: 6px; background: var(--blue); color: #fff; font-size: 7px; font-weight: 500; white-space: nowrap; }
  .srv .btn:hover { filter: brightness(1.1); }
  .srv .btn.ghost { background: var(--chip); color: #000; }
  .srv .btn:disabled { opacity: .6; cursor: progress; }
  .srv .status { display: flex; align-items: center; gap: 4px; font-size: 6.5px; color: var(--text-muted); }
  .srv .status i { width: 5px; height: 5px; border-radius: 50%; background: #b5b0ac; }
  .srv .status.on i { background: #2fbf71; box-shadow: 0 0 0 2px rgba(47,191,113,.2); }
  .srv .status.busy i { background: #f0a020; animation: blink .6s infinite; }
  .srv .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .srv .stat { background: #f6f3f1; border-radius: 6px; padding: 3px 4px; }
  .srv .stat b { display: block; font-size: 9px; font-weight: 500; }
  .srv .stat span { font-size: 5.5px; color: var(--text-muted); }
  .srv .job { font-size: 6.5px; color: var(--text-muted); }
  .srv .job b { color: #000; font-weight: 500; }
  .srv .log { flex: 1; min-height: 0; overflow: auto; background: #061230; color: #9fc3ff; border-radius: 6px; padding: 3px 5px;
              font: 5.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .srv .log div { white-space: nowrap; }
  .srv .empty { flex: 1; display: grid; place-items: center; text-align: center; color: var(--text-muted); font-size: 6.5px; line-height: 1.5; background: #f6f3f1; border-radius: 6px; }
  .srv[data-state="on"] .empty, .srv:not([data-state="on"]) .live { display: none; }
  .srv .live { display: contents; }

  /* Toast */
  .toast { left: 190px; top: 268px; width: 140px; text-align: center; font-size: 7px; color: #fff; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: .9; }


  /* ---------- Phone layout (stage.m): single column, 260×440 canvas ---------- */
  .stage.m .hex { left: -18px; top: 150px; }
  .stage.m .header { left: 8px; top: 8px; width: 244px; }
  .stage.m .logo-left { left: 18px; top: 18px; }
  .stage.m .logo-x { left: 40px; top: 19px; }
  .stage.m .logo-any { left: 52px; top: 18px; }
  .stage.m .stop { left: 221px; top: 16px; }
  /* Bigger invisible tap areas for the small round buttons */
  .stage.m .stop::before, .stage.m .help::before, .stage.m .vol-btn::before { content: ""; position: absolute; inset: -6px; }
  /* Larger window title bar and close button for touch */
  .stage.m .win .bar { height: 21px; padding: 0 4px 0 5px; }
  .stage.m .win .ttl { font-size: 8.5px; }
  .stage.m .win .wdot { width: 13px; height: 13px; }
  .stage.m .win .wdot img { left: 2.5px; top: 2.5px; width: 8px; height: 8px; }
  .stage.m .win .x, .stage.m .win .fs { width: 15px; height: 15px; }
  .stage.m .win .fs svg { inset: 3.5px; width: 8px; height: 8px; }
  .stage.m .win .x::before, .stage.m .win .x::after { left: 4px; top: 7px; width: 7px; height: 1px; }

  .stage.m .tile { width: 118px !important; }
  .stage.m .tile[data-win="camera"] { left: 8px !important;   top: 125px !important; }
  .stage.m .tile[data-win="lidar"]  { left: 134px !important; top: 125px !important; }
  .stage.m #car-tile                { left: 8px !important;   top: 55px !important; }
  .stage.m .tile[data-win="server"] { left: 134px !important; top: 55px !important; }
  /* Wider tiles: draw the rounded card in CSS so corners don't stretch */
  .stage.m .tile .bg img { display: none; }
  .stage.m .tile .bg { border-radius: 8px; background: var(--tile-off); transition: background .2s; }
  .stage.m .tile[aria-pressed="true"] .bg, .stage.m.live .tile .bg { background: #fff; }

  .stage.m .ip { left: 8px; top: 197px; width: 244px; }
  .stage.m .ip .field { left: 198.96px; }
  .stage.m .ip.editing .field, .stage.m .ip.filled .field { left: 26px; width: 218px; }

  .stage.m .panel { left: 8px; top: 230px; width: 244px; background: #fff; border-radius: 8px; }
  .stage.m .panel > .bg, .stage.m .sel { display: none; }
  .stage.m .divider { width: 244px; }

<script>
(() => {
  const stage = document.getElementById('stage');
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* Fit the canvas to the window: the Figma layout (450×286) on wide screens,
     a single-column layout (260×440) on phones held upright. */
  let stageScale = 1, SW = 450, SH = 286, isPhone = false, onScale = () => {};
  const useZoom = CSS.supports('zoom', '2');
  // Pointer position in canvas units. Worked out from the layout rather than measured,
  // because browsers report element sizes differently under zoom.
  function toStage(e) {
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    return { x: (e.clientX - (vw - SW * stageScale) / 2) / stageScale,
             y: (e.clientY - (vh - SH * stageScale) / 2) / stageScale };
  }
  const px = (el, prop) => parseFloat(getComputedStyle(el)[prop]);
  function fit() {
    // Visible area (innerWidth can include overflow on phones)
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const phone = vw < 600 && vh > vw;
    const changed = phone !== isPhone;
    isPhone = phone;
    stage.classList.toggle('m', phone);
    [SW, SH] = phone ? [260, 440] : [450, 286];
    stageScale = Math.min(vw / SW, vh / SH);
    // zoom lays the page out at its final size, so every layer is drawn crisp.
    // A scale transform draws at 450×286 and stretches, which Safari blurs for faded or filtered elements.
    if (useZoom) stage.style.zoom = stageScale;
    else stage.style.transform = `scale(${stageScale})`;
    onScale(changed);
  }
  addEventListener('resize', fit); fit();

  /* Toast */
  const toastEl = $('#toast'); let toastT;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 1800);
  }

  /* ---------- App state ----------
     Two levels: a login card asks for the car IP. Once the car connects, the full control
     panel is revealed. The car tile disconnects and returns to the login card.
     The stop button in the header halts the car (and resumes it) without disconnecting. */
  const S = { power: false, car: 'off', server: 'off', stopped: false, wins: {} };
  const ipRe = /^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/;
  const currentModel = () => $('.opt[aria-checked="true"]').dataset.model;
  const stopBtn = $('#stop'), carTile = $('#car-tile');
  const winTiles = $$('.tile[data-win]');
  const loginForm = $('#login-form'), loginIp = $('#login-ip'), loginField = $('#login-field'),
        loginBtn = $('#login-btn'), loginErr = $('#login-err');
  const controls = () => $$('button.ctl, .ctl button, .ctl input, #slider');

  function render() {
    const on = S.power;   // true while connected, i.e. the control panel is showing
    stage.classList.toggle('off', !on);
    stage.classList.toggle('login', !on);
    stage.classList.toggle('live', on);
    stage.classList.toggle('stopped', S.stopped);
    stopBtn.setAttribute('aria-pressed', S.stopped);
    stopBtn.setAttribute('aria-label', S.stopped ? 'Resume driving' : 'Stop the car');
    stopBtn.title = S.stopped ? 'Resume driving' : 'Stop the car';
    controls().forEach(el => {
      if (el.id === 'slider') { el.tabIndex = on ? 0 : -1; el.setAttribute('aria-disabled', !on); }
      else el.disabled = !on;
    });

    // Login card
    const busy = S.car === 'connecting';
    loginIp.readOnly = busy;
    loginBtn.disabled = busy;
    loginBtn.textContent = busy ? 'Connecting…' : 'Connect to Car';
    loginField.classList.toggle('busy', busy);

    // Control panel: the IP row shows the connected address, read-only
    ipInput.value = on ? loginIp.value.trim() : '';
    ipBox.classList.toggle('filled', on);

    carTile.setAttribute('aria-pressed', on);
    $('.state', carTile).textContent = on ? 'Disconnect' : '';
    winTiles.forEach(t => {
      const key = t.dataset.win;
      t.setAttribute('aria-pressed', !!S.wins[key]);
      $('.state', t).textContent = key === 'server'
        ? (S.server === 'on' ? 'Connected' : S.server === 'connecting' ? 'Connecting…' : '')
        : (S.wins[key] ? 'Live' : '');
    });
  }

  /* Level 1 → 2: connect from the login card */
  let carTimer;
  function connect() {
    if (S.car !== 'off') return;
    const ip = loginIp.value.trim();
    if (!ipRe.test(ip)) {
      loginField.classList.remove('shake'); void loginField.offsetWidth; loginField.classList.add('shake');
      loginField.classList.add('invalid');
      loginErr.textContent = ip ? 'That IP address isn’t valid. Use four numbers 0–255, like 192.168.0.42.' : 'Enter the car’s IP address.';
      loginIp.focus();
      return;
    }
    loginErr.textContent = '';
    loginField.classList.remove('invalid');
    S.car = 'connecting'; render();
    clearTimeout(carTimer);
    carTimer = setTimeout(() => {
      if (S.car !== 'connecting') return;
      S.car = 'on'; S.power = true; render();
      $$('.tile').forEach(t => { t.classList.remove('unlocked-flash'); void t.offsetWidth; t.classList.add('unlocked-flash'); });
      carTile.focus({ preventScroll: true });
      toast(`Connected to car at ${ip}`);
    }, 1100);
  }

  /* Level 2 → 1: disconnect and go back to the login card */
  function disconnect() {
    if (S.car !== 'on') return;
    clearTimeout(carTimer);
    Object.keys(S.wins).forEach(k => closeWin(k, true));
    server.disconnect(true);
    closeMenu();
    S.car = 'off'; S.power = false; S.stopped = false; render();
    loginIp.focus({ preventScroll: true });
    toast('Disconnected from car');
  }

  /* Stop / resume the car (stays connected) */
  function toggleStop() {
    if (S.car !== 'on') return;
    S.stopped = !S.stopped;
    render();
    toast(S.stopped ? 'Car stopped' : 'Resuming drive');
    if (S.server === 'on') server.log(S.stopped ? 'stop command sent → car halted' : 'resume command sent → driving');
  }

  loginForm.addEventListener('submit', e => { e.preventDefault(); connect(); });
  loginIp.addEventListener('input', () => {
    loginIp.value = loginIp.value.replace(/[^\d.]/g, '');
    loginField.classList.remove('invalid');
    loginErr.textContent = '';
  });
  stopBtn.addEventListener('click', toggleStop);
  carTile.addEventListener('click', disconnect);
  carTile.title = 'Disconnect from car';
  carTile.setAttribute('aria-label', 'Connected to car. Disconnect');

  /* Window tiles */
  winTiles.forEach(t => t.addEventListener('click', () => {
    if (S.car !== 'on') return;
    openWin(t.dataset.win);
  }));

  /* ---------- In-page windows ---------- */
  let zTop = 20;
  onScale = layoutChanged => {
    Object.values(S.wins).forEach(w => { if (layoutChanged || w.full) placeWin(w); w.resize && w.resize(); });
    if (layoutChanged) setVol(vol);   // slider width differs between layouts
  };
  const WINS = {
    camera: { title: 'Camera Feed',       icon: 'assets/camera.png', build: buildCamera, fullscreen: true,
              desk: { w: 206, h: 140, x: 172, y: 52 },  phone: { w: 248, h: 176, x: 6, y: 50 } },
    lidar:  { title: 'LiDAR Point-Cloud', icon: 'assets/cloud.png',  build: buildLidar, fullscreen: true,
              desk: { w: 206, h: 140, x: 234, y: 92 },  phone: { w: 248, h: 176, x: 6, y: 62 } },
    server: { title: 'Connect to Server', icon: 'assets/wifi.png',   build: buildServer,
              desk: { w: 176, h: 150, x: 204, y: 124 }, phone: { w: 248, h: 200, x: 6, y: 74 } },
  };
  const geom = def => isPhone ? def.phone : def.desk;
  function placeWin(win) {
    if (win.full) {
      // Cover the whole browser page: the stage sits centred and scaled, so work back to page edges in canvas units
      const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
      Object.assign(win.el.style, {
        left: -(vw - SW * stageScale) / 2 / stageScale + 'px', top: -(vh - SH * stageScale) / 2 / stageScale + 'px',
        width: vw / stageScale + 'px', height: vh / stageScale + 'px' });
      return;
    }
    const g = geom(WINS[win.key]);
    Object.assign(win.el.style, { left: g.x + 'px', top: g.y + 'px', width: g.w + 'px', height: g.h + 'px' });
  }

  function setFull(win, on) {
    win.full = on;
    win.el.classList.toggle('full', on);
    const b = $('.fs', win.el);
    b.setAttribute('aria-label', `${on ? 'Exit full screen' : 'Full screen'}: ${WINS[win.key].title}`);
    b.setAttribute('aria-pressed', on);
    placeWin(win);
    win.resize && win.resize();
    focusWin(win.key);
  }

  function focusWin(key) {
    Object.entries(S.wins).forEach(([k, w]) => w.el.classList.toggle('front', k === key));
    const w = S.wins[key];
    if (w) { w.el.style.zIndex = ++zTop; }
  }

  function openWin(key) {
    if (S.wins[key]) { focusWin(key); S.wins[key].el.focus({ preventScroll: true }); return; }
    const def = WINS[key];
    const el = document.createElement('section');
    el.className = 'win';
    el.tabIndex = -1;
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-label', def.title);
    el.innerHTML = `
      <header class="bar">
        <span class="wdot"><img src="${def.icon}" alt=""></span>
        <span class="ttl">${def.title}</span>
        ${def.fullscreen ? `<button class="fs" aria-label="Full screen: ${def.title}" aria-pressed="false">
          <svg class="grow" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 3V1h2M5 1h2v2M7 5v2H5M3 7H1V5"/></svg>
          <svg class="shrink" viewBox="0 0 8 8" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 1v2H1M7 3H5V1M5 7V5h2M1 5h2v2"/></svg>
        </button>` : ''}
        <button class="x" aria-label="Close ${def.title}"></button>
      </header>
      <div class="body"></div>`;
    stage.appendChild(el);
    const win = { key, el, body: $('.body', el) };
    S.wins[key] = win;
    placeWin(win);
    Object.assign(win, def.build(win.body, win) || {});
    $('.x', el).addEventListener('click', () => closeWin(key));
    if (def.fullscreen) $('.fs', el).addEventListener('click', () => setFull(win, !win.full));
    el.addEventListener('pointerdown', () => focusWin(key), true);
    // Esc leaves full screen first, then closes the window
    el.addEventListener('keydown', e => { if (e.key === 'Escape') { e.stopPropagation(); win.full ? setFull(win, false) : closeWin(key); } });
    makeDraggable(win, def);
    focusWin(key);
    el.focus({ preventScroll: true });
    render();
    startLoop();
  }

  function closeWin(key, silent) {
    const w = S.wins[key];
    if (!w) return;
    delete S.wins[key];
    w.destroy && w.destroy();
    w.el.classList.add('closing');
    setTimeout(() => w.el.remove(), 150);
    render();
    if (!silent) $(`.tile[data-win="${key}"]`).focus({ preventScroll: true });
  }

  function makeDraggable(win, def) {
    const bar = $('.bar', win.el);
    let start = null;
    bar.addEventListener('pointerdown', e => {
      if (e.target.closest('.x, .fs') || e.button > 0 || win.full) return;
      e.preventDefault();
      start = { x: e.clientX, y: e.clientY, l: parseFloat(win.el.style.left), t: parseFloat(win.el.style.top) };
      bar.setPointerCapture(e.pointerId);
      win.el.classList.add('dragging');
    });
    bar.addEventListener('pointermove', e => {
      if (!start) return;
      const g = geom(def);
      const l = Math.max(0, Math.min(SW - g.w, start.l + (e.clientX - start.x) / stageScale));
      const t = Math.max(0, Math.min(SH - g.h, start.t + (e.clientY - start.y) / stageScale));
      win.el.style.left = l + 'px'; win.el.style.top = t + 'px';
      g.x = l; g.y = t;                   // reopen where it was left
    });
    const end = () => { start = null; win.el.classList.remove('dragging'); };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);
    bar.addEventListener('lostpointercapture', end);
  }

  /* Shared animation loop for canvas windows */
  let looping = false, lastT = 0;
  function startLoop() {
    if (looping) return;
    looping = true; lastT = performance.now();
    requestAnimationFrame(function tick(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000); lastT = t;
      const frames = Object.values(S.wins).filter(w => w.frame);
      frames.forEach(w => w.frame(t, dt));
      if (frames.length) requestAnimationFrame(tick); else looping = false;
    });
  }

  /* Canvas sized for crisp drawing at the current stage scale */
  function makeCanvas(body) {
    const c = document.createElement('canvas');
    body.appendChild(c);
    const ctx = c.getContext('2d');
    const api = { c, ctx, W: 0, H: 0 };
    api.resize = () => {
      api.W = px(body, 'width'); api.H = px(body, 'height');
      const k = stageScale * (devicePixelRatio || 1);
      c.width = Math.round(api.W * k); c.height = Math.round(api.H * k);
      ctx.setTransform(k, 0, 0, k, 0, 0);
    };
    api.resize();
    return api;
  }

  /* ---------- Camera feed (simulated road scene) ---------- */
  function buildCamera(body) {
    body.classList.add('dark');
    const cv = makeCanvas(body), ctx = cv.ctx;
    const camH = 1.4, NEAR = 1.6;
    let travelled = 0, fpsAcc = 0, fpsN = 0, fps = 60, vNow = S.stopped ? 0 : 3 + curSpeed * 0.45;
    const rnd = (a, b) => a + Math.random() * (b - a);

    ];

  /* ---------- Server connection ---------- */
  const server = (() => {
    let timer, connectTimer, logLines = [], addr = 'ray://head-node:10001', ping = 24, frameNo = 1800;
    const listeners = new Set();
    const now = () => new Date().toTimeString().slice(0, 8);
    function log(s) { logLines.push(`[${now()}] ${s}`); if (logLines.length > 60) logLines.shift(); emit(); }
    function emit() { listeners.forEach(fn => fn()); }
    function tick() {

      frameNo += Math.round(3 + Math.random() * 3);
      const m = currentModel();
      const detail = m === 'Line Following' ? `lane offset ${(Math.random() * .3 - .15).toFixed(2)} m`
                   : m === 'Object Detection' ? `${2 + Math.floor(Math.random() * 4)} objects`
                   : `${1 + Math.floor(Math.random() * 3)} objects, lane ok`;
      log(`frame ${frameNo} → ${m.toLowerCase()}: ${detail} (${Math.round(ping * .6 + 6)} ms)`);
    }

      get state() { return S.server; }, get addr() { return addr; }, get ping() { return ping; }, get lines() { return logLines; },
      on(fn) { listeners.add(fn); return () => listeners.delete(fn); },
      log,
      connect(a) {

        if (!silent && was !== 'off') toast('Disconnected from server');

  })();

  function buildServer(body) {

    sel.style.top = opt.style.top;
    if (focus) opt.focus();
    if (S.server === 'on') server.log(`model switched → ${opt.dataset.model.toLowerCase().replace(/ /g, '-')}`);
  }
  opts.forEach((o, i) => {
    o.tabIndex = o.getAttribute('aria-checked') === 'true' ? 0 : -1;
    o.addEventListener('click', () => { if (o.getAttribute('aria-checked') !== 'true') { pick(o); toast(`Model: ${o.dataset.model}`); } });
    o.addEventListener('keydown', e => {
      const d = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
      if (!d) return; e.preventDefault();
      const n = opts[(i + d + opts.length) % opts.length]; pick(n, true); toast(`Model: ${n.dataset.model}`);
    });
  });
  const help = $('#help'), tip = $('#tip');
  help.addEventListener('click', e => { e.stopPropagation(); tip.classList.toggle('show'); });
  help.addEventListener('mouseenter', () => tip.classList.add('show'));
  help.addEventListener('mouseleave', () => tip.classList.remove('show'));
  help.addEventListener('blur', () => tip.classList.remove('show'));

  /* Max speed dropdown */
  const speed = $('#speed'), sBtn = $('#speed-btn'), sVal = $('#speed-val'), menu = $('#speed-menu');
  const speeds = [5, 10, 15, 20, 25, 30];
  speeds.forEach(v => {
    const b = document.createElement('button');
    b.textContent = v; b.setAttribute('role', 'option'); b.tabIndex = -1;
    b.addEventListener('click', e => { e.stopPropagation(); setSpeed(v); closeMenu(); sVal.focus(); });
    menu.appendChild(b);
  });
  // Max speed: type any whole number 1–99, or pick a preset from the menu.
  const MIN_SPEED = 1, MAX_SPEED = 99;
  let curSpeed = 10;
  function markCur() {
    $$('button', menu).forEach(b => { const on = +b.textContent === curSpeed; b.classList.toggle('cur', on); b.setAttribute('aria-selected', on); });
  }
  function setSpeed(v) {
    speed.classList.remove('invalid');
    sVal.value = curSpeed = v;
    markCur();
    toast(`Max speed: ${v}`);
  }
  function commitTyped() {
    const raw = sVal.value.trim();
    if (raw === String(curSpeed)) { speed.classList.remove('invalid'); return; }
    const v = Number(raw);
    if (raw && Number.isInteger(v) && v >= MIN_SPEED && v <= MAX_SPEED) { setSpeed(v); return; }
    speed.classList.add('invalid');
    toast(`Speed must be ${MIN_SPEED}–${MAX_SPEED}`);
    sVal.value = curSpeed;
    setTimeout(() => speed.classList.remove('invalid'), 1200);
  }
  markCur();
  function openMenu(focusItem) {
    speed.classList.add('open'); sVal.setAttribute('aria-expanded', 'true');
    if (focusItem) ($('.cur', menu) || menu.firstChild).focus();
  }
  function closeMenu() { speed.classList.remove('open'); sVal.setAttribute('aria-expanded', 'false'); }
  sBtn.addEventListener('mousedown', e => e.preventDefault()); // keep focus where it is
  sBtn.addEventListener('click', e => { e.stopPropagation(); speed.classList.contains('open') ? closeMenu() : openMenu(true); });
  sVal.addEventListener('focus', () => sVal.select());
  sVal.addEventListener('input', () => { sVal.value = sVal.value.replace(/\D/g, ''); speed.classList.remove('invalid'); });
  sVal.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commitTyped(); closeMenu(); sVal.select(); }
    if (e.altKey && e.key === 'ArrowDown') { e.preventDefault(); openMenu(true); return; }
    const step = { ArrowUp: 1, ArrowDown: -1 }[e.key];
    if (step) {
      e.preventDefault();
      const v = curSpeed + step;
      if (v >= MIN_SPEED && v <= MAX_SPEED) setSpeed(v);
      sVal.select();
    }
    if (e.key === 'Escape') { sVal.value = curSpeed; speed.classList.remove('invalid'); closeMenu(); }
  });
  sVal.addEventListener('blur', commitTyped);
  menu.addEventListener('keydown', e => {
    const items = $$('button', menu), i = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[Math.min(i + 1, items.length - 1)].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); i <= 0 ? (closeMenu(), sVal.focus()) : items[i - 1].focus(); }
    if (e.key === 'Escape' || e.key === 'Tab') { closeMenu(); sVal.focus(); e.preventDefault(); }
  });
  document.addEventListener('click', e => { if (!speed.contains(e.target)) closeMenu(); if (e.target !== help) tip.classList.remove('show'); });

  /* Car IP row on the control panel: shows the connected address, read-only */
  const ipBox = $('#ip'), ipInput = $('#ip-input');
  ipInput.readOnly = true;
  ipBox.classList.add('locked');

  /* Volume slider: knob 13px on a 100px track; dark fill runs from the knob to the end */
  const slider = $('#slider'), knob = $('#knob'), fill = $('#fill'), readout = $('#readout'), volBtn = $('#vol-btn');
  let vol = 31, lastVol = 31;
  function setVol(v) {
    vol = Math.round(Math.max(0, Math.min(100, v)));
    const x = vol / 100 * (px(slider, 'width') - 13);   // knob left within track
    knob.style.left = x + 'px';
    fill.style.left = (x + 5) + 'px';
    slider.setAttribute('aria-valuenow', vol);
    readout.textContent = vol;
    volBtn.classList.toggle('muted', vol === 0);
    volBtn.setAttribute('aria-pressed', vol === 0);
    volBtn.setAttribute('aria-label', vol === 0 ? 'Unmute' : 'Mute');
  }
  setVol(vol);
  function fromEvent(e) {
    const x = toStage(e).x - px(slider, 'left');
    return (x - 6.5) / (px(slider, 'width') - 13) * 100;
  }
  slider.addEventListener('pointerdown', e => {
    if (stage.classList.contains('off') || e.button > 0) return;
    e.preventDefault();
    slider.focus({ preventScroll: true, focusVisible: false });
    slider.setPointerCapture(e.pointerId); slider.classList.add('drag'); setVol(fromEvent(e));
  });
  slider.addEventListener('dragstart', e => e.preventDefault());
  slider.addEventListener('pointermove', e => { if (slider.classList.contains('drag')) setVol(fromEvent(e)); });
  const end = () => { if (slider.classList.contains('drag')) { slider.classList.remove('drag'); if (vol) lastVol = vol; } };
  slider.addEventListener('pointerup', end); slider.addEventListener('pointercancel', end);
  slider.addEventListener('lostpointercapture', end);
  slider.addEventListener('keydown', e => {
    if (stage.classList.contains('off')) return;
    const step = { ArrowRight: 5, ArrowUp: 5, ArrowLeft: -5, ArrowDown: -5, PageUp: 20, PageDown: -20 }[e.key];
    if (step) { e.preventDefault(); setVol(vol + step); if (vol) lastVol = vol; }
    if (e.key === 'Home') { e.preventDefault(); setVol(0); }
    if (e.key === 'End') { e.preventDefault(); setVol(100); lastVol = 100; }
  });
  volBtn.addEventListener('click', () => {
    if (vol) { lastVol = vol; setVol(0); toast('Muted'); } else { setVol(lastVol || 50); toast(`Volume ${vol}`); }
  });
  render();
  if (!isPhone) loginIp.focus();   // phones would pop the keyboard straight away
})();
</script>
</body>
